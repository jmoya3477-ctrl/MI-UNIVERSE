<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Universo 360°</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="cuerpo-universo">

    <canvas id="universo3D"></canvas>

    <header class="interfaz-superior">
        <h1>Nuestro Universo</h1>
        <p>Arrastra para explorar en 360° • Toca las estrellas más brillantes</p>
    </header>

    <div class="indicador-fase">
        <span id="nombreFormacion">Espiral Galáctica Viva</span>
    </div>

    <!-- Modal / Tarjeta de recuerdo con fotografía o video -->
    <div id="modalRecuerdo" class="modal oculto">
        <div class="tarjeta-cristal">
            <button id="cerrarModal" class="btn-cerrar" aria-label="Cerrar">&times;</button>
            
            <div class="contenedor-foto">
                <img id="imagenTarjeta" src="" alt="Recuerdo espacial" style="display: none;">
                <iframe id="videoTarjeta" src="" frameborder="0" width="100%" height="100%" allowfullscreen style="display: none; position: absolute; top: 0; left: 0;"></iframe>
            </div>

            <div class="contenido-texto">
                <h2 id="tituloTarjeta">Título</h2>
                <p id="textoTarjeta">Mensaje...</p>
                <span id="firmaTarjeta" class="firma"></span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
